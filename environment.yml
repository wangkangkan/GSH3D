name: gsh3d
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy
  - scipy
  - scikit-image
  - scikit-learn
  - pillow
  - opencv
  - tqdm
  - pyyaml
  - joblib
  - pip:
    - torch==2.0.1+cu118
    - torchvision==0.15.2+cu118
    - torchaudio==2.0.2+cu118
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - pytorch3d
    - smplx
    - trimesh
    - configargparse
    - munch
    - lpips
    - clean-fid
    - plyfile
    - open3d
